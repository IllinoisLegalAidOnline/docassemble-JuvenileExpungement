generic object: DAObject
question: |
  Edit record details
subquestion: |
  <div class="alert alert-info ilao-info" role="alert">
    <h6 class="alert-heading">Information about juvenile records relief</h6>
    <p><ul>
      <li><a href="${url_action('expungement_info')}"><b>Clearing your juvenile record in Illinois</b></a></li>
      <li><a href="${url_action('more_expungement_info')}"><b>Objections to expungement</b></a></li>
      <li><a href="${url_action('records_info')}"><b>Two kinds of juvenile records</b></a></li>
      <li><a href="${url_action('more_records_info')}"><b>How to view or get copies of your juvenile records</b></a></li>
    </p>
  </div>

  Edit your answers below.
  
  **Note:** Changing these details may affect eligibility for expungement. Be sure to review your forms before filing.
review: 
  - Edit: x.date
    button: |
      **Arrest date:**
      ${x.date}
  - Edit: x.after_arrest
    button: |
      **What happened after the arrest?**

      % if x.after_arrest == "no_charge":
      * I was **released** without being charged in court.
      % elif x.after_arrest == "diversion":
      * I was given a **diversion** program at the police station or at the probation department.
      % elif x.after_arrest == "successful_supervision":
      * I was given **supervision**, which the court said was **completed successfully**.
      % elif x.after_arrest == "failed_supervision":
      * I was given **supervision**, which the court said was **not** completed successfully.
      % else:
      * I went to court (saw a judge).
      % endif
  - Edit: x.at_court
    button: |
      **What happened when you went to court?**

      % if x.at_court == "dismissed":
      * The case was thrown out (dismissed).
      % elif x.at_court == "not_delinquent":
      * I was found not delinquent (not guilty).
      % else:
      * I was adjudicated delinquent (found guilty).
      % endif
    show if: x.after_arrest == "court"
  - Edit: x.found_guilty
    button: |
      % if x.found_guilty != "other":
      **What were you found guilty of?**
      
      % if x.found_guilty == "traffic":
      * A traffic offense
      % elif x.found_guilty == "murder":
      * First-degree murder or a felony sex offense
      % elif x.found_guilty == "felony_or_a":
      * A felony or Class A misdemeanor
      % elif x.found_guilty == "b_or_c":
      * A Class B or Class C misdemeanor
      % else:
      * A petty offense
      % endif
      % else:
      **Were you found guilty of an offense that could be expunged?**
      No
      % endif
    show if: x.after_arrest == "court" and x.at_court == "other"
  - Edit: x.must_register
    button: |
      **Did the court require you to register on the Juvenile Sex Offender Registry?**
      ${word(yesno(x.must_register))}
    show if: (x.after_arrest == "court" and x.at_court == "other" and x.found_guilty == "felony_or_a") or x.after_arrest == "successful_supervision" or x.after_arrest == "failed_supervision"
  - Edit: x.has_ended
    button: |
      % if x.found_guilty == "felony_or_a":
      **Has your sentence for this case ended?**
      % else:
      **Have the court proceedings for this case ended?**
      % endif
      ${word(yesno(x.has_ended))}
    show if: x.after_arrest == "court" and x.at_court == "other"
  - Edit: x.charge
    button: |
      **What were you arrested for?**
      ${x.charge}
  - label: Edit
    fields:
      - recompute:
        - x.prepare_agency_review
      - x.agency_selection
      - x.agency.name.first
      - recompute:
          - x.agency_code_block
    button: |
      **Arresting agency:**
      ${x.selected_agency.name.first}
  
      ${x.selected_agency.address.line_one(bare=True)}
      ${x.selected_agency.address.line_two()}
  - Edit: x.outcome
    button: |
      **Outcome of the arrest:**

      % if x.outcome == "A":
      * **A** - Arrest without court case filed/station or probation adjustment/pre-petition diversion
      % elif x.outcome == "ND":
      * **ND** - Adjudicated not delinquent (found not guilty)
      % elif x.outcome == "S":
      * **S** - Given supervision and the court decided it was completed successfully
      % elif x.outcome == "BC":
      * **BC** - Adjudicated delinquent for (guilty of) class B or C misdemeanor (includes supervision not terminated successfully)
      % elif x.outcome == "FA":
      * **FA** - Adjudicated delinquent for (guilty of) felony or class A misdemeanor (includes supervision not terminated successfully)
      % else:
      * **D** - Case dismissed (thrown out)
      % endif
  - Edit: x.case_number
    button: |
      **Case number:**
      % if x.case_number == "":
      None entered
      % else:
      ${x.case_number}
      % endif
    show if: x.after_arrest != "no_charge"
  - Edit: x.enforcement_number
    button: |
      **Law enforcement number:**
      % if x.enforcement_number == "":
      None entered
      % else:
      ${x.enforcement_number}
      % endif
continue button label: Next
