#arrests gather loop
code: |
  arrests[i].date
  if arrests[i].after_arrest == "court":
    if arrests[i].at_court == "other":
      if arrests[i].found_guilty == "other" or arrests[i].found_guilty == "traffic" or arrests[i].found_guilty == "murder":
        arrests[i].cannot_expunge_offense_type
      else:
        if arrests[i].found_guilty == "felony_or_a":
          if arrests[i].must_register:
            arrests[i].cannot_expunge_registry
          elif not arrests[i].has_ended:
            arrests[i].cannot_expunge_open
          elif arrests[i].case_end_date > today().minus(years=2):
            arrests[i].cannot_expunge_recent
        elif not arrests[i].has_ended:
          arrests[i].cannot_expunge_open
  elif arrests[i].after_arrest == "successful_supervision" or arrests[i].after_arrest == "failed_supervision":
    if arrests[i].must_register:
      arrests[i].cannot_expunge_registry
    
  if is_eligible(arrests[i]):
    arrests[i].charge

    arrests[i].agency_code_block  
    arrests[i].outcome
    if arrests[i].after_arrest != "no_charge":
      arrests[i].case_number
    arrests[i].enforcement_number  

  arrests[i].complete = True
---
only sets: arrests[i].agency_code_block
code: |
  if any_other_eligible_arrests() and arrests[i].agency_selection != "other":
    arrests[i].agency = agencies[int(arrests[i].agency_selection)]
    arrests[i].selected_agency = arrests[i].agency
    
  else:  
    arrests[i].agency.name.first
    arrests[i].selected_agency = arrests[i].agency
    
    already_appended_flag = False
    for check_agency in agencies:
      if arrests[i].agency == check_agency:
        already_appended_flag = True
    if not already_appended_flag:
      agencies.append(arrests[i].agency)
    if not defined("arrests[i].agency_selection"):
      arrests[i].agency_selection = "other"

  arrests[i].agency_code_block = True
---
code: |
  def any_other_eligible_arrests():
    if arrests.number_gathered() == 1:
      return False
    else:
      for arrest in arrests[:-1]:
        if is_eligible(arrest):
          return True
    return False
---
code: |
  def which_subsection(arrest):
    if arrest.after_arrest == "court" and arrest.at_court == "other" and arrest.found_guilty == "felony_or_a":
      return "2"
    else:
      return "1"
---
reconsider: True
code: |
  subsection_1_flag = False
  subsection_2_flag = False
  qualified_arrests = [arrest for arrest in arrests if is_eligible(arrest)]
  for arrest in qualified_arrests:
    if which_subsection(arrest) == "2":
      subsection_2_flag = True
    else:
      subsection_1_flag = True
  filter_arrests = True
---
reconsider: True
code: |
  notice_agencies.clear()
  for agency in agencies:
    agency.include_flag = False
    for arrest in arrests:
      if is_eligible(arrest):
        if agency == arrest.agency:
          agency.include_flag = True
    if agency.include_flag:
      notice_agencies.append(agency)
  build_notice_agencies = True
---
code: |
  stuff_to_snapshot = {
