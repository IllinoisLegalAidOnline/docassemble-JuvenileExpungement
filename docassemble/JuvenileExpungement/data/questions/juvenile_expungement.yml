  Next steps
subquestion: |
  After you download your forms, you must file them with the Circuit Clerk in the county where you were arrested or charged. This program **does not file** your forms for you. To learn about the filing process, see ILAO's [**Court process for expungement or sealing FAQ**](https://www.illinoislegalaid.org/node/185996).

  For details about how to file expungement requests in ${ filing_location.county } County, contact the Circuit Clerk's office. You can find your Circuit Clerk's phone number on the [**Illinois Courts website:**](https://ilcourts.info/clerks).

  There is no fee to file a *${form_name}* in Illinois. However, there may be fees to get records from police departments, certified dispositions, or documents. 

  After you file the *Request* and get a court date, you may need to go to court for a court date in front of a judge. Some counties schedule a court date right away, but others will only schedule a court date if a police department or prosecutor files an objection to your *Request*.
  
  Finally, the court will decide on your *Request*. To learn about what happens after the court makes its decision, read ILAO's [**After your expungement or sealing case is decided FAQ**](https://www.illinoislegalaid.org/node/186001).
  
  To learn more, download and read the "How to Expunge Juvenile Records" instructions at the end of this program.
