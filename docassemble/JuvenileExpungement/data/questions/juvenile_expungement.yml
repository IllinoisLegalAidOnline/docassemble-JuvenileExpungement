    datatype: radio
    choices:
      - "**A** - **Arrest** without court case filed/station or probation adjustment/pre-petition diversion": A
      - "**ND** - Adjudicated **not delinquent** (found not guilty)": ND
      - "**S** - Given **supervision** and the court decided it was completed **successfully**": S
      - "**BC** - Adjudicated delinquent for (guilty of) **class B or C misdemeanor** (includes supervision not terminated successfully)": BC
      - "**FA** - Adjudicated delinquent for (guilty of) **felony or class A misdemeanor** (includes supervision not terminated successfully)": FA
