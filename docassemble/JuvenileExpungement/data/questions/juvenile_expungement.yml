id: arrest date
question: |
  When was the date of the ${ordinal(i)} arrest?
subquestion: |
   ${collapse_template(where_to_find_records_help)}
fields:
  - Date: arrests[i].date
    datatype: date
    max: ${today()}
validation code: |
  arrests[i].name = arrests[i].date
---
id: after arrest
question: |
  What happened after the ${arrests[i].date} arrest?
subquestion: |
  You can click on the ${ fa_icon("question-circle", color_css="#0dcaf0" ) } by each option to learn more.
fields: 
  - no label: arrests[i].after_arrest
    input type: radio
    choices:
      - I was arrested as a juvenile but never appeared before a judge.: no_charge
        help: |
          You might see the words “station adjustment” or “released without charging” on your records. This also may mean that the State’s Attorney did not file formal charges against you or that your case was diverted out of court.
      - I was given a diversion program at the police station or at the probation department.: diversion
        help: |
          Diversion programs are an alternative to criminal prosecution. Diversion programs available in Illinois include the Drug Deferred Prosecution Program, the Mental Health Treatment Court, and the Restorative Justice Community Court, among others.
      - I was sentenced to supervision and **completed** it successfully.: successful_supervision
        help: |
          Supervision is when the court puts off finding you guilty and gives you a period of time when you must follow certain conditions, such as doing community service or not breaking any laws.
      - I was sentenced to supervision, but I **did not complete** it successfully.: failed_supervision
        help: |
          Supervision is when the court puts off finding you guilty and gives you a period of time when you must follow certain conditions, such as doing community service or not breaking any laws.
      - I went to court (saw a judge).: court
---
id: at court
question: |
  What happened when you went to court for the ${arrests[i].date} arrest?
field: arrests[i].at_court
choices:
  - The case was dismissed (sometimes marked as Nolle Prosequi (NP) or Stricken Off with Leave to Reinstate (SOL)).: dismissed
  - I was adjudicated not delinquent (found not guilty).: not_delinquent
  - Something else happened: other
---
id: found guilty
question: |
  Were you found guilty of any of the following?
subquestion: |
  If you were **adjudicated delinquent** of an offense, that means you were found guilty of it.
field: arrests[i].found_guilty
