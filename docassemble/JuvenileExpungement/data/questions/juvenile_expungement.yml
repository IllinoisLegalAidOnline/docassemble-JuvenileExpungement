---
code: |
  def build_expungement_outcomes():
    expungement_outcomes.auto_gather = False
    expungement_outcomes.clear()

    expungement_outcomes.append({
      'abbreviation': 'A',
      'disposition': 'Arrest without court case filed/station or probation adjustment/pre-petition diversion',
      'more_information': 'You were arrested but not charged with an offense or brought to court, or you were assigned a diversion program.'
  })
    expungement_outcomes.append({
      'abbreviation': 'ND',
      'disposition': 'Adjudicated not delinquent (found not guilty)',
      'more_information': 'The court decided you were not guilty of the offense you were charged with.'
    })
    expungement_outcomes.append({
      'abbreviation': 'S',
      'disposition': 'Given supervision and the court decided it was completed successfully',
      'more_information': 'The court kept your case open for a set period of time. You followed the conditions during that time and the court dismissed the juvenile charges against you.'
    })
    expungement_outcomes.append({
      'abbreviation': 'BC',
      'disposition': 'Adjudicated delinquent for (guilty of) class B or C misdemeanor (includes supervision not terminated successfully)',
      'more_information': 'You were adjudicated delinquent (found guilty) of a class B or C misdemeanor. A class B misdemeanor is a lesser crime punishable by a fine or confinement in county jail for up to six months. A class C misdemeanor is punishable by a fine or confinement in county jail for up to 30 days.'
    })
    expungement_outcomes.append({
      'abbreviation': 'FA',
      'disposition': 'Adjudicated delinquent for (guilty of) felony or class A misdemeanor (includes supervision not terminated successfully)',
      'more_information': 'You were adjudicated delinquent (found guilty) of a felony or a class A misdemeanor. A felony is a serious crime that is punishable by more than one year in prison. A class A misdemeanor is a lesser crime punishable by a fine or confinement up to one year in county jail.'
    })
    expungement_outcomes.append({
      'abbreviation': 'D',
      'disposition': 'Case dismissed (thrown out)',
      'more_information': 'The state stopped prosecuting your case and the court dismissed the case.'
    })
    expungement_outcomes.gathered = True
    return
