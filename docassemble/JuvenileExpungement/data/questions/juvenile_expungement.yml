reconsider: True
code: |
  elements_for_order_bundle = []
  elements_for_case_list_bundle = []
  elements_for_records_bundle = []
  elements_for_agencies_bundle = []
  
  for index, arrest in enumerate(qualified_arrests):
    if index > 9 and index % 5 == 0:
      arrest.index_for_records = index
      arrest.records.enabled = True
      elements_for_records_bundle.append(arrest.records)
  records_bundle.elements = elements_for_records_bundle

  number_index = 0
  #This is added to ensure that the order template still assembles even if the user has not entered any case numbers. dummy_list_for_order_if_no_numbers is a list that tries to approximate the all_numbers list object without containing any meaningful data
  if len(all_numbers) == 0:
    dummy_list_for_order_if_no_numbers[0].order.enabled = True
    elements_for_order_bundle.append(dummy_list_for_order_if_no_numbers[0].order)
  while number_index < len(all_numbers):
    if number_index % 10 == 0:
      all_numbers[number_index].index_for_order = number_index
      all_numbers[number_index].order.enabled = True
      elements_for_order_bundle.append(all_numbers[number_index].order)
    if number_index % 65 == 0:
      all_numbers[number_index].index_for_case_list = number_index
      all_numbers[number_index].case_list.enabled = True
      elements_for_case_list_bundle.append(all_numbers[number_index].case_list)
    number_index += 1
  case_list_bundle.elements = elements_for_case_list_bundle
  order_bundle.elements = elements_for_order_bundle

  for index, agency in enumerate(notice_agencies):
    if index > 3 and index % 4 == 0:
      agency.index_for_agencies = index
      agency.agencies.enabled = True
      elements_for_agencies_bundle.append(agency.agencies)
  agencies_bundle.elements = elements_for_agencies_bundle
  
  refresh_bundles = True
---
reconsider: True
code: |
  all_numbers.clear()
  numbers_index = 0
  for arrest in qualified_arrests:
    if arrest.after_arrest != "no_charge" and arrest.case_number != "":
      all_numbers.appendObject(Individual)
      all_numbers[numbers_index].name.first = arrest.case_number
      numbers_index += 1
    if arrest.enforcement_number != "":
      all_numbers.appendObject(Individual)
      all_numbers[numbers_index].name.first = arrest.enforcement_number
      numbers_index += 1
  if len(all_numbers) == 0:
    dummy_list_for_order_if_no_numbers.clear()
    dummy_list_for_order_if_no_numbers.appendObject(Individual)
    dummy_list_for_order_if_no_numbers[0].name.first = "______"
  list_numbers = True
